{% extends "hermes/base_static.html" %}
{% block content %}
<div class="container py-4">
  <div class="neon-glass-card p-4">
    <h1 class="mb-2">Newsletters</h1>
    <p class="text-muted mb-4">Signals, field notes, and practical frameworks.</p>

    <div class="row g-3">
      {% for s in series_list %}
      <div class="col-md-6 col-lg-4">
        <a class="text-decoration-none" href="/newsletters/{{ s.slug }}/">
          <div class="neon-glass-card p-3 h-100">
            <h4 class="mb-1">{{ s.name }}</h4>
            <div class="small opacity-75">{{ s.description|default:"" }}</div>
          </div>
        </a>
      </div>
      {% empty %}
      <div class="opacity-75">No newsletter series published yet.</div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
