{% extends "common/base.html" %}
{% block content %}

<style>
  .codex-prose { color: #dfe4ee; line-height: 1.7; overflow-wrap: anywhere; }
  .codex-prose h1, .codex-prose h2, .codex-prose h3, .codex-prose h4 { color: #fff; margin: 1.4rem 0 .6rem; }
  .codex-prose h1 { font-size: 1.9rem; } .codex-prose h2 { font-size: 1.5rem; } .codex-prose h3 { font-size: 1.25rem; }
  .codex-prose a { color: #5dd6c6; }
  .codex-prose code { background: rgba(255,255,255,.08); padding: 2px 6px; border-radius: 6px; font-size: .9em; }
  .codex-prose pre { background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: 14px 16px; overflow-x: auto; }
  .codex-prose pre code { background: none; padding: 0; }
  .codex-prose table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
  .codex-prose th, .codex-prose td { border: 1px solid rgba(255,255,255,.15); padding: 6px 10px; text-align: left; }
  .codex-prose blockquote { border-left: 3px solid #5dd6c6; margin: 1rem 0; padding: .2rem 1rem; color: #b9c2d0; }
  .codex-prose ul, .codex-prose ol { padding-left: 1.3rem; }
  .codex-prose img { max-width: 100%; border-radius: 8px; }
</style>

<div class="glass-header mb-3">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
    <div>
      <h1 class="mb-0">{% if doc.pinned %}📌 {% endif %}{{ doc.title }}</h1>
      <div class="text-soft small">
        <span class="badge bg-secondary">{{ doc.project }}</span>
        <code style="font-size:.8rem">{{ doc.path }}</code>
        · {{ doc.mtime|date:"Y-m-d H:i" }} · {{ doc.size_human }}
      </div>
    </div>
    <div class="d-flex gap-2">
      <form method="post" action="{% url 'codex:toggle' doc.pk %}">
        {% csrf_token %}<input type="hidden" name="field" value="pinned">
        <button class="btn-glass" type="submit">{% if doc.pinned %}📌 Unpin{% else %}📍 Pin{% endif %}</button>
      </form>
      <form method="post" action="{% url 'codex:toggle' doc.pk %}">
        {% csrf_token %}<input type="hidden" name="field" value="read">
        <button class="btn-glass" type="submit">{% if doc.read %}○ Mark unread{% else %}✓ Mark read{% endif %}</button>
      </form>
      <a class="btn-glass" href="{% url 'codex:list' %}">← Library</a>
    </div>
  </div>
</div>

<div class="neon-glass-card p-4">
  <div class="codex-prose">{{ html|safe }}</div>
</div>

{% endblock %}
