{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto mt-16 p-8 bg-white rounded shadow">
  <h2 class="text-2xl font-bold text-center mb-4">Login</h2>
  <form method="post">
    {% csrf_token %}
    <div class="mb-4">
      <label class="block mb-1">Username</label>
      <input type="text" name="username" class="w-full px-4 py-2 border rounded" required>
    </div>
    <div class="mb-4">
      <label class="block mb-1">Password</label>
      <input type="password" name="password" class="w-full px-4 py-2 border rounded" required>
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">Log In</button>
  </form>
</div>
{% endblock %}
