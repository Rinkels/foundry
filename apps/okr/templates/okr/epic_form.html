{% extends "common/base.html" %}
{% block content %}

<div style="max-width: 920px; margin: 0 auto;">
  <div class="d-flex align-items-end justify-content-between gap-3 mb-3">
    <div>
      <h2 class="mb-0">{% if object %}Edit{% else %}Create{% endif %} Epic</h2>
      <div class="text-soft mt-1">Define the epic clearly, then let AI draft a clean description.</div>
    </div>

        {% if epic.key_result_id %}
          <a href="{% url 'okr:keyresult-epics' epic.key_result_id %}">Back</a>
        {% else %}
          <a href="{% url 'okr:strategy-heatmap' %}">Back</a>
        {% endif %}

  </div>

  <form method="post" class="neon-glass-card p-4">
    {% csrf_token %}

    <div class="form-grid">
      <label for="{{ form.title.id_for_label }}" class="text-soft">Title</label>
      {{ form.title }}

      <label for="id_description" class="text-soft">Description</label>
      <textarea name="description" id="id_description" rows="7" class="textarea-glass">{{ form.instance.description }}</textarea>
    </div>

    <div class="d-flex gap-2 flex-wrap mt-4">
      <button type="submit" class="btn-glass">Save Epic</button>
      <button type="button" class="btn-glass" onclick="generateEpicDescription()">✨ Write with AI</button>
    </div>
  </form>
</div>

<script>
(function () {
  // Ensure title input gets neon styling even if widget attrs aren't set yet
  const titleEl = document.getElementById("id_title");
  if (titleEl) titleEl.classList.add("input-glass");
})();

function generateEpicDescription() {
  const title = document.getElementById("id_title")?.value || "";
  if (!title) {
    alert("Please enter a title first.");
    return;
  }

  fetch("/api/rewrite-epic-description/", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-CSRFToken": "{{ csrf_token }}"
    },
    body: JSON.stringify({ title })
  })
  .then(r => r.json())
  .then(data => {
    const desc = document.getElementById("id_description");
    if (desc) desc.value = data.rewritten || "";
  })
  .catch(err => console.error("AI Rewrite Error:", err));
}
</script>

{% endblock %}
