{% extends "common/base.html" %}
{% block content %}

<div style="max-width: 920px; margin: 0 auto;">
  <div class="d-flex align-items-end justify-content-between gap-3 mb-3">
    <div>
      <h2 class="mb-0">{% if object %}Edit{% else %}Create{% endif %} Objective</h2>
      <div class="text-soft mt-1">Keep it crisp, measurable, and readable.</div>
    </div>

    <a href="{% url 'okr:objective-list' %}" class="text-strong" style="text-decoration: underline;">
      ← Back to Objectives
    </a>
  </div>

  <form method="post" class="neon-glass-card p-4">
    {% csrf_token %}

    <div class="form-grid">
      <label for="id_name" class="text-soft">Name</label>
      <input type="text" name="name" id="id_name" class="input-glass" value="{{ form.instance.name }}">

      <label for="id_description" class="text-soft">Description</label>
      <textarea name="description" id="id_description" rows="7" class="textarea-glass">{{ form.instance.description }}</textarea>
    </div>

    <div class="d-flex gap-2 flex-wrap mt-4">
      <button type="submit" class="btn-glass">Save Objective</button>
      <button type="button" class="btn-glass" onclick="rewriteDescription()">✨ Rewrite with AI</button>
    </div>
  </form>
</div>

<script>
function rewriteDescription() {
  const nameInput = document.getElementById("id_name").value;
  const descriptionInput = document.getElementById("id_description");

  if (!nameInput) {
    alert("Please enter an objective name first.");
    return;
  }

  fetch("{% url 'okr:rewrite-objective-description' %}", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-CSRFToken": "{{ csrf_token }}" },
    body: JSON.stringify({ objective: nameInput })
  })
  .then(r => r.json())
  .then(data => { descriptionInput.value = data.rewritten; })
  .catch(err => console.error("AI Rewrite Error:", err));
}
</script>

{% endblock %}
