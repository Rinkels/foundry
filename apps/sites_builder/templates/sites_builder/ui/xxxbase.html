<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Fractals Builder{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

  {% block extra_head %}{% endblock %}
    {% if site.primary_color or site.secondary_color %}
<style>
  :root {
    {% if site.primary_color %}--fractals-primary: {{ site.primary_color }};{% endif %}
    {% if site.secondary_color %}--fractals-secondary: {{ site.secondary_color }};{% endif %}
  }

  .btn-primary {
    {% if site.primary_color %}background-color: var(--fractals-primary); border-color: var(--fractals-primary);{% endif %}
  }
  .btn-outline-primary {
    {% if site.primary_color %}color: var(--fractals-primary); border-color: var(--fractals-primary);{% endif %}
  }
  a {
    {% if site.primary_color %}color: var(--fractals-primary);{% endif %}
  }
</style>
{% endif %}

</head>
<body class="{% if site.theme == 'dark' %}bg-dark text-light{% else %}bg-light{% endif %}">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'sites_builder:dashboard' %}">
        Fractals Builder
      </a>
    </div>
  </nav>

  <main class="container mb-5">
    {% if messages %}
      <div class="mb-3">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }} mb-2" role="alert">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
