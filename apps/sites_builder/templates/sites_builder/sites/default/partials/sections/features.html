<section class="lp-section lp-features-band">
  <div class="lp-container">
    {% if s.eyebrow %}<div class="lp-section__eyebrow">{{ s.eyebrow }}</div>{% endif %}
    {% if s.heading %}<h2 class="lp-section__heading">{{ s.heading }}</h2>{% endif %}
    {% if s.subhead %}<p class="lp-section__subhead">{{ s.subhead }}</p>{% endif %}
    <div class="lp-features">
      {% for item in s.items %}
        <div class="lp-feature">
          {% if item.icon %}<div class="lp-feature__icon">{{ item.icon }}</div>{% endif %}
          <h3 class="lp-feature__title">{{ item.title }}</h3>
          {% if item.text %}<p class="lp-feature__text">{{ item.text }}</p>{% endif %}
        </div>
      {% endfor %}
    </div>
  </div>
</section>
